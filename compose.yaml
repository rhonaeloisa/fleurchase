services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT}:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_CA: ${DB_SSL_CA}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_images:/var/www/html/fleurchase/images
      - app_uploads:/var/www/html/fleurchase/uploads
      - type: bind
        source: ${AIVEN_CA_FILE}
        target: /run/secrets/ca-fleurchase.pem
        read_only: true

  db:
    image: mariadb:10.4.32
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/fleurchase_db.sql:/docker-entrypoint-initdb.d/01-fleurchase.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_images:
  app_uploads:
